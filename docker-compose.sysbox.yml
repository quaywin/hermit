services:
  hermit:
    image: ghcr.io/quaywin/hermit:latest
    container_name: hermit_orchestrator
    network_mode: host # Bypass Docker NAT for 100% Direct P2P Tailscale connections
    # Use Sysbox runtime for advanced security isolation on Linux
    runtime: sysbox-runc
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    env_file:
      - ${HOME}/.hermit/env
    volumes:
      # Mount storage directory for Sandboxed configurations
      - ${HOME}/.hermit/storage:/app/storage
    environment:
      - PHX_SERVER=true
      - PORT=3000
      - STORAGE_BASE_PATH=/app/storage
    restart: "on-failure:5"
