# fly.toml app configuration file generated for hermit on 2026-07-25T10:58:19+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hermit'
primary_region = 'sin'

[vm]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[swap]
  size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  MIX_ENV = 'prod'
  PORT = '8080'
  STORAGE_BASE_PATH = '/app/storage'
  ERL_FLAGS = '+sbwt none +sbwtdcpu none +sbwtdio none +sub true'
  POOL_SIZE = '2'
  ERL_CRASH_DUMP = '/dev/null'

[[mounts]]
  source = 'hermit_data'
  destination = '/app/storage'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/up'
# Standalone Port 53 DNS (UDP)
[[services]]
  internal_port = 53
  protocol = "udp"
  [[services.ports]]
    port = 53

# Standalone Port 53 DNS (TCP)
[[services]]
  internal_port = 53
  protocol = "tcp"
  [[services.ports]]
    port = 53

