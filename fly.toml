# fly.toml app configuration file generated for hermit on 2026-07-25T10:58:19+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hermit'
primary_region = 'sin'

[vm]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[build]
  dockerfile = 'Dockerfile'

[env]
  MIX_ENV = 'prod'
  PORT = '8080'
  STORAGE_BASE_PATH = '/app/storage'

[[mounts]]
  source = 'hermit_data'
  destination = '/app/storage'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/'
    protocol = 'http'
