services:
  hermit:
    image: ghcr.io/quaywin/hermit:latest
    container_name: hermit_orchestrator
    # network_mode: host # Uncomment if running standard Docker (runc) on Linux for 100% Direct P2P NAT bypass
    ports:
      - "${HERMIT_PORT:-3000}:3000" # Web dashboard
      - "41641-41700:41641-41700/udp" # Tailscale UDP port range
    privileged: true
    env_file:
      - ${HOME}/.hermit/env
    volumes:
      # Mount storage directory for Sandboxed configurations
      - ${HOME}/.hermit/storage:/app/storage
    environment:
      - PHX_SERVER=true
      - PORT=3000
      - STORAGE_BASE_PATH=/app/storage
    restart: "on-failure:5"
