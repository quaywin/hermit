services:
  hermit:
    image: ghcr.io/quaywin/hermit:latest
    container_name: hermit_orchestrator
    network_mode: host
    privileged: true
    env_file:
      - ${HOME}/.hermit/env
    volumes:
      # Mount storage directory for database and configurations
      - ${HOME}/.hermit/storage:/app/storage
      # Mount docker socket for 1-click self-upgrade from Web UI
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PHX_SERVER=true
      - PORT=${HERMIT_PORT:-3000}
      - STORAGE_BASE_PATH=/app/storage
    restart: "unless-stopped"
