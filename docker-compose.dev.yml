services:
  hermit:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000" # Web dashboard
      - "5300:53/udp" # Port 53 UDP for DDNS Matcher (mapped to host port 5300)
      - "5300:53/tcp" # Port 53 TCP for DDNS Matcher (mapped to host port 5300)
      - "41641-41700:41641-41700/udp" # Tailscale UDP port range
    privileged: true
    env_file:
      - .env
    volumes:
      # Mount the whole project directory so code updates are hot-reloaded
      - .:/app
      - /app/_build
      - ${HOME}/.hermit/dev-storage:/app/storage
    environment:
      - MIX_ENV=dev
      - PHX_SERVER=true
      - PORT=3000
      - STORAGE_BASE_PATH=/app/storage
    restart: "on-failure:5"
