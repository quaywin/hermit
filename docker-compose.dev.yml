services:
  hermit:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${HERMIT_PORT:-3000}:3000" # Web dashboard
      - "5300:53/udp" # Port 53 UDP for DDNS Matcher (mapped to host port 5300)
      - "5300:53/tcp" # Port 53 TCP for DDNS Matcher (mapped to host port 5300)
      - "41642-41700:41642-41700/udp" # Tailscale UDP port range
    privileged: true
    env_file:
      - .env
    volumes:
      # Mount the whole project directory so code updates are hot-reloaded
      - .:/app
      - hermit_dev_build:/app/_build
      - ${HOME}/.hermit/dev-storage:/app/storage
    cpus: 2.0
    mem_limit: 1024m
    environment:
      - MIX_ENV=dev
      - PHX_SERVER=true
      - PORT=3000
      - STORAGE_BASE_PATH=/app/storage
      - GOMEMLIMIT=32MiB
      - GOGC=50
      - ERL_FLAGS=+S 2:2
    restart: "on-failure:5"

volumes:
  hermit_dev_build:
